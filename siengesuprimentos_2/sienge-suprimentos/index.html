function NewRequest(p){
  var bs=useState(""),building=bs[0],setBuilding=bs[1];

  var is=useState([]),items=is[0],setItems=is[1];

  return h("div",{className:"fade",style:{maxWidth:760}},
    h(H,{title:"Nova Solicitacao de Compra",sub:"POST /purchase-requests + POST .../items. Entra no Sienge como nao autorizada, aguardando avaliacao interna."}),

        h(Field,{label:"Qtd."}, h("input",{value:draft.qty,onChange:function(e){setDraft(assign({},draft,{qty:e.target.value}));},placeholder:"100",style:inp})),
        h(Field,{label:"Unidade"}, h("select",{value:draft.unit,onChange:function(e){setDraft(assign({},draft,{unit:e.target.value}));},style:inp}, ["UN","KG","M","M2","M3","SC","L","CX"].map(function(u){return h("option",{key:u},u);}))),

            h("button",{className:"btn",onClick:function(){setItems(items.filter(function(_,x){return x!==i;}));},style:{background:"transparent",color:C.red,fontSize:18,padding:0}},"×")));})) : null,
