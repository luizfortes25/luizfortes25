<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sienge · Suprimentos e Estoque</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#eef1f4;font-family:'Barlow',system-ui,sans-serif;color:#1b2733}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;font-family:inherit;font-weight:600;transition:filter .12s,transform .08s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(1px)}
input,textarea,select{font-family:'IBM Plex Mono',ui-monospace,monospace;outline:none}
input:focus,textarea:focus,select:focus{border-color:#ee6c1f!important}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#f1f4f7}
::-webkit-scrollbar-thumb{background:#c5cdd7;border-radius:4px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fade .3s ease both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.pop{animation:pop .18s ease both}
.row-hover{transition:background .1s}
.row-hover:hover{background:#f4f7fa}
</style>
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:'IBM Plex Mono',monospace;color:#69788a">Carregando…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script>
(function(){
"use strict";
var {createElement:h,useState,useEffect,useMemo,useCallback,Fragment} = React;

/* ── Cores ── */
var C = {
  orange:"#ee6c1f", orangeDk:"#c8551a",
  ink:"#1b2733", steel:"#2c3e50",
  bg:"#eef1f4", panel:"#ffffff", line:"#dce1e7", muted:"#69788a",
  green:"#1f9d55", greenBg:"#e3f5ec",
  amber:"#c98a00", amberBg:"#fdf3da",
  blue:"#2667b3", blueBg:"#e6eff8",
  red:"#cc3344",  redBg:"#fbe3e6"
};
var F = "'Barlow',system-ui,sans-serif";
var M = "'IBM Plex Mono',ui-monospace,monospace";
var MC = {GET:C.green,POST:C.orange,PUT:C.blue,PATCH:C.amber,DELETE:C.red};

/* ── Dados de demo ── */
var DEMO_ORDERS = [
  {id:4821,building:"Residencial Aurora · Torre B",supplier:"Votorantim Cimentos",value:48230,status:"PENDING",items:7,delivery:"2026-06-22"},
  {id:4820,building:"Edifício Mares · Fundação",supplier:"Gerdau Aços",value:112900,status:"PENDING",items:3,delivery:"2026-06-25"},
  {id:4818,building:"Condomínio Vale Verde",supplier:"Tigre Tubos",value:9740.5,status:"QUOTING",items:12,delivery:null},
  {id:4815,building:"Residencial Aurora · Torre A",supplier:"Deca Metais",value:27600,status:"AUTHORIZED",items:5,delivery:"2026-06-20"},
  {id:4811,building:"Galpão Industrial Norte",supplier:"Saint-Gobain Brasil",value:63100,status:"AUTHORIZED",items:9,delivery:"2026-06-18"},
  {id:4809,building:"Condomínio Vale Verde",supplier:"Knauf Drywall",value:18450,status:"DISAPPROVED",items:4,delivery:null}
];
var DEMO_REQUESTS = [
  {id:8031,building:"102",dept:"3",items:[{name:"Cimento CP-II 50kg",qty:200,unit:"SC"},{name:"Areia média lavada",qty:15,unit:"M3"}],status:"PENDING"},
  {id:8028,building:"105",dept:"1",items:[{name:"Vergalhão CA-50 10mm",qty:500,unit:"M"}],status:"PENDING"}
];
var DEMO_STOCK = [
  {resource:"Cimento CP-II 50kg",brand:"Votorantim",qty:340,unit:"SC",cc:"Aurora-B"},
  {resource:"Vergalhão CA-50 10mm",brand:"Gerdau",qty:1280,unit:"M",cc:"Mares"},
  {resource:"Tubo PVC 100mm",brand:"Tigre",qty:96,unit:"UN",cc:"Vale Verde"},
  {resource:"Areia média lavada",brand:"—",qty:42,unit:"M3",cc:"Aurora-B"},
  {resource:"Bloco cerâmico 9×19×19",brand:"Selecta",qty:8600,unit:"UN",cc:"Norte"}
];
var DEMO_MOVEMENTS = [
  {id:"MV-2051",type:"IN",resource:"Cimento CP-II 50kg",qty:200,unit:"SC",cc:"Aurora-B",date:"2026-06-14"},
  {id:"MV-2050",type:"OUT",resource:"Vergalhão CA-50 10mm",qty:320,unit:"M",cc:"Mares",date:"2026-06-13"},
  {id:"MV-2048",type:"IN",resource:"Bloco cerâmico 9×19×19",qty:5000,unit:"UN",cc:"Norte",date:"2026-06-12"},
  {id:"MV-2045",type:"OUT",resource:"Tubo PVC 100mm",qty:24,unit:"UN",cc:"Vale Verde",date:"2026-06-11"}
];
var STATUS_MAP = {
  PENDING:{label:"Aguardando Autorização",bg:C.amberBg,fg:C.amber,dot:C.amber},
  QUOTING:{label:"Em Cotação",bg:C.blueBg,fg:C.blue,dot:C.blue},
  AUTHORIZED:{label:"Autorizado",bg:C.greenBg,fg:C.green,dot:C.green},
  DISAPPROVED:{label:"Reprovado",bg:C.redBg,fg:C.red,dot:C.red}
};
var ENDPOINTS_ORDERS = [
  ["Consulta","GET","/purchase-orders","Lista pedidos — filtros por status, obra, fornecedor."],
  ["Consulta","GET","/purchase-orders/{id}","Detalhe do pedido e cotação que o originou."],
  ["Itens","GET","/purchase-orders/{id}/items","Lista os itens e suas cotações."],
  ["Itens","GET","/purchase-orders/{id}/items/{n}","Detalhe de um item específico."],
  ["Itens","GET","/purchase-orders/{id}/items/{n}/delivery-schedules","Previsão de entrega do item."],
  ["Itens","GET","/purchase-orders/{id}/items/{n}/buildings-appropriations","Apropriações de obra do item."],
  ["Totalização","GET","/purchase-orders/{id}/totalization","Total, descontos, frete e condições de pgto."],
  ["Faturamento","GET","/purchase-orders/{id}/direct-billing","Dados de faturamento direto."],
  ["Aprovação","PUT","/purchase-orders/{id}/authorize","Autoriza pedido pendente."],
  ["Aprovação","PATCH","/purchase-orders/{id}/authorize","Autoriza com observação."],
  ["Reprovação","PUT","/purchase-orders/{id}/disapprove","Reprova pedido pendente."],
  ["Reprovação","PATCH","/purchase-orders/{id}/disapprove","Reprova com observação."],
  ["Anexos","POST","/purchase-orders/{id}/attachments","Insere anexo no pedido."],
  ["Anexos","GET","/purchase-orders/{id}/attachments","Lista anexos do pedido."],
  ["Anexos","GET","/purchase-orders/{id}/attachments/{n}","Baixa anexo em PDF."],
  ["Avaliação","GET","/purchase-orders/{id}/supplier-evaluation-criteria","Critérios de avaliação."],
  ["Avaliação","POST","/purchase-orders/{id}/evaluation","Registra avaliação do fornecedor."],
  ["Avaliação","PUT","/purchase-orders/{id}/evaluation","Atualiza avaliação."],
  ["Relatório","GET","/purchase-orders/{id}/analysis/pdf","Gera relatório de análise em PDF."]
];
var ENDPOINTS_REQUESTS = [
  ["Solicitação","POST","/purchase-requests","Cria solicitação para obra existente."],
  ["Solicitação","GET","/purchase-requests/{id}","Consulta solicitação e seus insumos."],
  ["Solicitação","PATCH","/purchase-requests/{id}/authorize","Autoriza todos os itens aguardando."],
  ["Solicitação","PATCH","/purchase-requests/{id}/disapproval","Reprova todos os itens aguardando."],
  ["Itens","GET","/purchase-requests/all/items","Todos os itens de todas as solicitações."],
  ["Itens","GET","/purchase-requests/{id}/items/{n}/buildings-appropriations","Apropriações de obra de um item."],
  ["Itens","GET","/purchase-requests/{id}/items/{n}/delivery-requirements","Entregas de um item."],
  ["Itens","POST","/purchase-requests/{id}/items","Adiciona insumos à solicitação."],
  ["Itens","PATCH","/purchase-requests/{id}/items/{n}/authorize","Autoriza item individual."],
  ["Itens","PATCH","/purchase-requests/{id}/items/{n}/disapproval","Reprova item individual."],
  ["Anexos","GET","/purchase-requests/{id}/attachments","Lista anexos da solicitação."],
  ["Anexos","GET","/purchase-requests/{id}/attachments/{n}","Baixa anexo em PDF."]
];
var ENDPOINTS_STOCK = [
  ["Itens","GET","/stock-inventories/{costCenterId}/items","Insumos em estoque de um centro de custo."],
  ["Itens","GET","/stock-inventories/{costCenterId}/items/{resourceId}/building-appropriation","Apropriações de obra do insumo."],
  ["Reservas","GET","/stock-reservations","Lista reservas consistentes (paginado)."],
  ["Reservas","GET","/stock-reservations/{reservationId}/items","Itens de uma reserva."],
  ["Reservas","POST","/stock-reservations/{reservationId}/movements","Movimento que atende a reserva."],
  ["Movimentos","GET","/stock-movements","Lista movimentos de entrada/saída."],
  ["Movimentos","POST","/stock-movements","Cria entrada ou saída para um ou mais insumos."]
];

/* ── Helpers ── */
function brl(v){return (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function fmtDate(d){if(!d)return "—";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0].slice(2);}
function merge(){return Object.assign.apply(Object,arguments);}

var inp = {width:"100%",padding:"10px 13px",borderRadius:8,border:"1px solid "+C.line,fontSize:13.5,background:"#fbfcfd",color:C.ink};
function minibtn(bg,fg,bd){return{background:bg,color:fg,border:bd?"1px solid "+bd:"none",padding:"6px 11px",borderRadius:7,fontSize:12.5};}
function tabStyle(active){return{padding:"9px 15px",borderRadius:8,fontSize:13,background:active?C.steel:C.panel,color:active?"#fff":C.muted,border:"1px solid "+(active?C.steel:C.line)};}

/* ── Componentes base ── */
function Badge({s}){
  var st=STATUS_MAP[s]||STATUS_MAP.QUOTING;
  return h("span",{style:{display:"inline-flex",alignItems:"center",gap:6,padding:"3px 9px",borderRadius:6,background:st.bg,color:st.fg,fontWeight:600,fontSize:12,whiteSpace:"nowrap"}},
    h("span",{style:{width:6,height:6,borderRadius:6,background:st.dot}}),st.label);
}
function Stat({label,value,c,small}){
  return h("div",{style:{background:C.panel,border:"1px solid "+C.line,borderRadius:10,padding:"14px 15px",borderLeft:"4px solid "+c}},
    h("div",{style:{fontWeight:800,fontSize:small?20:30,lineHeight:1}},value),
    h("div",{style:{fontSize:12,color:C.muted,marginTop:6,fontWeight:500}},label));
}
function PageHead({title,sub}){
  return h("div",null,
    h("h2",{style:{fontWeight:800,fontSize:"clamp(20px,3.5vw,26px)",margin:0,letterSpacing:-0.3}},title),
    sub&&h("p",{style:{fontSize:14,color:C.muted,margin:"5px 0 0",maxWidth:640,lineHeight:1.5}},sub));
}
function Field({label,hint,children}){
  return h("div",{style:{marginBottom:14}},
    h("label",{style:{fontSize:13,fontWeight:600,display:"block",marginBottom:5,fontFamily:F}},label),
    children,
    hint&&h("div",{style:{fontSize:12,color:C.muted,marginTop:5,fontFamily:F}},hint));
}
function Spinner(){
  return h("span",{style:{width:13,height:13,border:"2px solid "+C.line,borderTopColor:C.orange,borderRadius:13,animation:"spin .7s linear infinite",display:"inline-block"}});
}
function EmptyRow({cols,msg}){
  return h("tr",null,h("td",{colSpan:cols,style:{padding:36,textAlign:"center",color:C.muted,fontStyle:"italic",fontSize:13}},msg||"Nenhum registro."));
}
function TH({children}){
  return h("th",{style:{padding:"11px 14px",fontSize:11.5,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:0.4,borderBottom:"1px solid "+C.line,whiteSpace:"nowrap",background:"#f1f4f7",textAlign:"left"}},children);
}
function TD({children,style}){
  return h("td",{style:merge({padding:"11px 14px"},style||{})},children);
}

/* ── Modal ── */
function Modal({modal,close,onAuthorize,onDisapprove,onAttach,onEval}){
  var [note,setNote]=useState("");
  var [file,setFile]=useState("");
  var [score,setScore]=useState(5);
  var [comment,setComment]=useState("");
  var o=modal.order;
  var titles={note:"Autorizar / Reprovar com observação",attach:"Anexar arquivo ao pedido",eval:"Avaliar fornecedor"};
  var body;
  if(modal.type==="note"){
    body=h(Fragment,null,
      h(Field,{label:"Observação"},h("textarea",{value:note,onChange:e=>setNote(e.target.value),rows:3,placeholder:"Motivo / justificativa…",style:merge({},inp,{resize:"vertical"})})),
      h("div",{style:{display:"flex",gap:10}},
        h("button",{onClick:()=>{onAuthorize(o.id,note||"OK");close();},style:{flex:1,background:C.green,color:"#fff",padding:"11px",borderRadius:8,fontFamily:F,fontWeight:700,cursor:"pointer",border:"none"}},"Autorizar c/ obs."),
        h("button",{onClick:()=>{onDisapprove(o.id,note||"Reprovado");close();},style:{flex:1,background:"#fff",color:C.red,border:"1px solid "+C.red,padding:"11px",borderRadius:8,fontFamily:F,fontWeight:700,cursor:"pointer"}},"Reprovar c/ obs.")));
  }else if(modal.type==="attach"){
    body=h(Fragment,null,
      h(Field,{label:"Nome do arquivo",hint:"No app real, aqui entraria o upload do PDF."},h("input",{value:file,onChange:e=>setFile(e.target.value),placeholder:"cotacao.pdf",style:inp})),
      h("button",{onClick:()=>{onAttach(o.id,file||"arquivo.pdf");close();},style:{width:"100%",background:C.orange,color:"#fff",padding:"11px",borderRadius:8,fontFamily:F,fontWeight:700,cursor:"pointer",border:"none"}},"Enviar anexo"));
  }else{
    body=h(Fragment,null,
      h(Field,{label:"Nota do fornecedor (1 a 5)"},h("select",{value:score,onChange:e=>setScore(Number(e.target.value)),style:inp},[1,2,3,4,5].map(n=>h("option",{key:n,value:n},n+" estrela"+(n>1?"s":""))))),
      h(Field,{label:"Comentário"},h("textarea",{value:comment,onChange:e=>setComment(e.target.value),rows:3,placeholder:"Prazo, qualidade, atendimento…",style:merge({},inp,{resize:"vertical"})})),
      h("button",{onClick:()=>{onEval(o.id,score,comment);close();},style:{width:"100%",background:C.orange,color:"#fff",padding:"11px",borderRadius:8,fontFamily:F,fontWeight:700,cursor:"pointer",border:"none"}},"Registrar avaliação"));
  }
  return h("div",{onClick:close,style:{position:"fixed",inset:0,background:"rgba(20,28,38,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:55,padding:16}},
    h("div",{className:"pop",onClick:e=>e.stopPropagation(),style:{background:C.panel,borderRadius:14,padding:24,width:"100%",maxWidth:460,boxShadow:"0 24px 60px rgba(0,0,0,.32)"}},
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}},
        h("div",{style:{fontWeight:700,fontSize:18}},titles[modal.type]),
        h("button",{onClick:close,style:{background:"transparent",color:C.muted,fontSize:22,lineHeight:1,padding:0,cursor:"pointer",border:"none"}},"×")),
      h("div",{style:{fontSize:13,color:C.muted,marginBottom:18}},"Pedido #"+o.id+" · "+o.building),
      body));
}

/* ── Pedidos ── */
function OrdersPage({orders,live,loading,onReload,onAuthorize,onDisapprove,onAttach,onEval}){
  var [filter,setFilter]=useState("ALL");
  var [q,setQ]=useState("");
  var [modal,setModal]=useState(null);
  var counts=useMemo(()=>{
    var c={PENDING:0,QUOTING:0,AUTHORIZED:0,DISAPPROVED:0,total:0};
    orders.forEach(o=>{c.total+=o.value||0;if(c[o.status]!=null)c[o.status]++;});
    return c;
  },[orders]);
  var visible=orders.filter(o=>{
    if(filter!=="ALL"&&o.status!==filter)return false;
    if(q){var ql=q.toLowerCase();return (o.building+o.supplier+o.id).toLowerCase().includes(ql);}
    return true;
  });
  return h("div",{className:"fade"},
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:20}},
      h(Stat,{label:"Aguardando",value:counts.PENDING,c:C.amber}),
      h(Stat,{label:"Em cotação",value:counts.QUOTING,c:C.blue}),
      h(Stat,{label:"Autorizados",value:counts.AUTHORIZED,c:C.green}),
      h(Stat,{label:"Reprovados",value:counts.DISAPPROVED,c:C.red}),
      h(Stat,{label:"Valor total",value:brl(counts.total),c:C.orange,small:true})),
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:10}},
      h(PageHead,{title:"Pedidos de Compra",sub:live?"Dados ao vivo · GET /purchase-orders":"Modo demo — conecte o backend na aba Conexão"}),
      h("div",{style:{display:"flex",gap:8,alignItems:"center"}},
        h("input",{value:q,onChange:e=>setQ(e.target.value),placeholder:"Buscar obra / fornecedor…",style:merge({},inp,{width:220})}),
        h("button",{onClick:onReload,style:{background:C.panel,color:C.steel,border:"1px solid "+C.line,padding:"9px 13px",borderRadius:8,fontSize:13,display:"flex",alignItems:"center",gap:7,fontFamily:F,fontWeight:600,cursor:"pointer"}},loading&&h(Spinner),"Recarregar"))),
    h("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:14}},
      ["ALL","PENDING","QUOTING","AUTHORIZED","DISAPPROVED"].map(k=>{
        var labels={ALL:"Todos",PENDING:"Aguardando",QUOTING:"Em cotação",AUTHORIZED:"Autorizados",DISAPPROVED:"Reprovados"};
        return h("button",{key:k,onClick:()=>setFilter(k),style:{padding:"7px 13px",borderRadius:7,fontSize:12.5,background:filter===k?C.steel:C.panel,color:filter===k?"#fff":C.muted,border:"1px solid "+(filter===k?C.steel:C.line),fontFamily:F,fontWeight:600,cursor:"pointer"}},labels[k]+(k!=="ALL"?" ("+counts[k]+")":""));
      })),
    h("div",{style:{background:C.panel,border:"1px solid "+C.line,borderRadius:10,overflow:"hidden"}},
      h("div",{style:{overflowX:"auto"}},
        h("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:14,minWidth:820}},
          h("thead",null,h("tr",null,["Nº","Obra","Fornecedor","Itens","Entrega","Valor","Status","Ações"].map(x=>h(TH,{key:x},x)))),
          h("tbody",null,
            visible.map(o=>h("tr",{key:o.id,className:"row-hover",style:{borderBottom:"1px solid "+C.line}},
              h(TD,{style:{fontFamily:M,fontWeight:600,color:C.steel}},"#"+o.id),
              h(TD,{style:{fontWeight:600}},o.building),
              h(TD,{style:{color:C.muted}},o.supplier),
              h(TD,{style:{textAlign:"center"}},o.items),
              h(TD,{style:{fontFamily:M,fontSize:13}},fmtDate(o.delivery)),
              h(TD,{style:{fontFamily:M,fontWeight:600,whiteSpace:"nowrap"}},brl(o.value)),
              h(TD,null,h(Badge,{s:o.status})),
              h(TD,null,h("div",{style:{display:"flex",gap:5,flexWrap:"wrap"}},
                o.status==="PENDING"&&h(Fragment,null,
                  h("button",{onClick:()=>onAuthorize(o.id),style:minibtn(C.green,"#fff")},"Autorizar"),
                  h("button",{onClick:()=>onDisapprove(o.id),style:minibtn("#fff",C.red,C.red)},"Reprovar")),
                h("button",{onClick:()=>setModal({type:"note",order:o}),style:minibtn("#fff",C.steel,C.line)},"+ Obs."),
                h("button",{onClick:()=>setModal({type:"attach",order:o}),style:minibtn("#fff",C.steel,C.line)},"Anexo"),
                h("button",{onClick:()=>setModal({type:"eval",order:o}),style:minibtn("#fff",C.steel,C.line)},"Avaliar"))))),
            visible.length===0&&h(EmptyRow,{cols:8,msg:"Nenhum pedido para esse filtro."}))))),
    modal&&h(Modal,{modal,close:()=>setModal(null),onAuthorize,onDisapprove,onAttach,onEval}));
}

/* ── Nova Solicitação ── */
function NewRequestPage({onCreate,requests,live}){
  var [building,setBuilding]=useState("");
  var [dept,setDept]=useState("");
  var [items,setItems]=useState([]);
  var [draft,setDraft]=useState({name:"",qty:"",unit:"UN"});
  function addItem(){if(!draft.name.trim())return;setItems([...items,{...draft,qty:Number(draft.qty)||1}]);setDraft({name:"",qty:"",unit:"UN"});}
  function submit(){if(!building.trim())return;onCreate({buildingId:building,departmentId:dept},items);setBuilding("");setDept("");setItems([]);}
  return h("div",{className:"fade",style:{maxWidth:760}},
    h(PageHead,{title:"Nova Solicitação de Compra",sub:"POST /purchase-requests + POST …/items. Entra no Sienge como não autorizada, aguardando avaliação interna."}),
    h("div",{style:{background:C.panel,border:"1px solid "+C.line,borderRadius:10,padding:22,marginTop:16}},
      h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}},
        h(Field,{label:"Código da obra (buildingId)",hint:"Número da obra como cadastrado no Sienge (ex.: 102)."},h("input",{value:building,onChange:e=>setBuilding(e.target.value),placeholder:"ex.: 102",style:inp})),
        h(Field,{label:"Departamento (opcional)"},h("input",{value:dept,onChange:e=>setDept(e.target.value),placeholder:"ex.: 5",style:inp}))),
      h("div",{style:{fontWeight:700,fontSize:15,margin:"8px 0 10px"}},"Insumos"),
      h("div",{style:{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:8,alignItems:"end"}},
        h(Field,{label:"Insumo"},h("input",{value:draft.name,onChange:e=>setDraft({...draft,name:e.target.value}),placeholder:"Cimento CP-II 50kg",style:inp})),
        h(Field,{label:"Qtd."},h("input",{value:draft.qty,onChange:e=>setDraft({...draft,qty:e.target.value}),placeholder:"100",style:inp})),
        h(Field,{label:"Unidade"},h("select",{value:draft.unit,onChange:e=>setDraft({...draft,unit:e.target.value}),style:inp},["UN","KG","M","M2","M3","SC","L","CX","PC","BD"].map(u=>h("option",{key:u},u)))),
        h("button",{onClick:addItem,style:{background:C.steel,color:"#fff",padding:"10px 14px",borderRadius:8,height:40,fontFamily:F,fontWeight:700,cursor:"pointer",border:"none"}},"+ Add")),
      items.length>0&&h("div",{style:{marginTop:14,border:"1px solid "+C.line,borderRadius:8,overflow:"hidden"}},

/* ── App principal ── */
function App(){
  var [tab,setTab]=useState("orders");
  var [cfg,setCfg]=useState({baseUrl:"",token:""});
  var [connected,setConnected]=useState(false);
  var [orders,setOrders]=useState(DEMO_ORDERS);
  var [requests,setRequests]=useState(DEMO_REQUESTS);
  var [stock,setStock]=useState(DEMO_STOCK);
  var [movements,setMovements]=useState(DEMO_MOVEMENTS);
  var [loading,setLoading]=useState(false);
  var [toast,setToast]=useState(null);
  var [logLines,setLogLines]=useState([]);
  var live=connected&&cfg.baseUrl.trim()!=="";

  var notify=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(null),3500);},[]);
  var log=useCallback(line=>{setLogLines(p=>[{t:new Date().toLocaleTimeString("pt-BR"),line},...p].slice(0,50));},[]);

  var api=useCallback((method,path,body)=>{
    var base=cfg.baseUrl.replace(/\/+$/,"");
    log("→ "+method+" "+path);
    return fetch(base+path,{method,headers:{"Content-Type":"application/json",...(cfg.token?{Authorization:"Bearer "+cfg.token}:{})},body:body?JSON.stringify(body):undefined})
      .then(res=>res.text().then(txt=>{
        var data=null;try{data=txt?JSON.parse(txt):null;}catch(e){data=txt;}
        log("← "+res.status+" "+res.statusText);
        if(!res.ok){var e=new Error("HTTP "+res.status+" — "+((data&&(data.error||data.message))||res.statusText));e.status=res.status;throw e;}
        return data;
      }));
  },[cfg,log]);

  var loadOrders=useCallback(()=>{
    if(!live){setOrders(DEMO_ORDERS);return;}
    setLoading(true);
    api("GET","/purchase-orders")
      .then(data=>{var list=Array.isArray(data)?data:((data&&data.results)||[]);setOrders(list);notify(list.length+" pedidos carregados do Sienge");})
      .catch(e=>notify("Falha: "+e.message))
      .finally(()=>setLoading(false));
  },[live,api,notify]);
  useEffect(()=>{loadOrders();},[loadOrders]);

  function doAuthorize(id,note){
    var method=note?"PATCH":"PUT";
    if(!live){setOrders(p=>p.map(o=>o.id===id?{...o,status:"AUTHORIZED"}:o));notify("Pedido #"+id+" autorizado (demo)");return;}
    api(method,"/purchase-orders/"+id+"/authorize",note?{notes:note}:undefined)
      .then(()=>{setOrders(p=>p.map(o=>o.id===id?{...o,status:"AUTHORIZED"}:o));notify("Pedido #"+id+" autorizado no Sienge");})
      .catch(e=>notify("Erro: "+e.message));
  }
  function doDisapprove(id,note){
    var method=note?"PATCH":"PUT";
    if(!live){setOrders(p=>p.map(o=>o.id===id?{...o,status:"DISAPPROVED"}:o));notify("Pedido #"+id+" reprovado (demo)");return;}
    api(method,"/purchase-orders/"+id+"/disapprove",note?{notes:note}:undefined)
      .then(()=>{setOrders(p=>p.map(o=>o.id===id?{...o,status:"DISAPPROVED"}:o));notify("Pedido #"+id+" reprovado no Sienge");})
      .catch(e=>notify("Erro: "+e.message));
  }
  function createRequest(payload,items){
    if(!live){
      var fake={id:Math.floor(8000+Math.random()*999),...payload,items,status:"PENDING"};
      setRequests(p=>[fake,...p]);notify("Solicitação criada (demo) #"+fake.id);return;
    }
    var body={buildingId:Number(payload.buildingId)};
    if(payload.departmentId)body.departmentId=Number(payload.departmentId);
    var bodyItems=items.map(it=>({resourceDescription:it.name,quantity:Number(it.qty)||1,unitOfMeasure:it.unit}));
    api("POST","/purchase-requests",body)
      .then(created=>{
        var rid=created&&(created.purchaseRequestId||created.id);
        if(!rid){notify("Solicitação criada, backend não retornou ID");return;}
        if(!items.length){setRequests(p=>[{id:rid,...payload,items,status:"PENDING"},...p]);notify("Solicitação #"+rid+" criada");return;}
        return api("POST","/purchase-requests/"+rid+"/items",{items:bodyItems})
          .then(()=>{setRequests(p=>[{id:rid,...payload,items,status:"PENDING"},...p]);notify("Solicitação #"+rid+" criada com "+items.length+" itens");});
      })
      .catch(e=>notify("Falha ao criar: "+e.message));
  }
  function attach(id,filename){
    if(!live){notify("Anexo enviado (demo)");return;}
    api("POST","/purchase-orders/"+id+"/attachments",{filename}).then(()=>notify("Anexo enviado ao pedido #"+id)).catch(e=>notify("Erro: "+e.message));
  }
  function evaluate(id,score,comment){
    if(!live){notify("Avaliação registrada (demo)");return;}
    api("POST","/purchase-orders/"+id+"/evaluation",{score,comment}).then(()=>notify("Fornecedor avaliado · pedido #"+id)).catch(e=>notify("Erro: "+e.message));
  }
  function createMovement(mv){
    var entry={id:"MV-"+Math.floor(3000+Math.random()*9999),type:mv.type,resource:mv.resource,qty:mv.quantity,unit:mv.unit,cc:mv.costCenterId,date:new Date().toISOString().slice(0,10)};
    if(!live){setMovements(p=>[entry,...p]);notify("Movimento registrado (demo) "+entry.id);return;}
    api("POST","/stock-movements",{type:mv.type,costCenterId:mv.costCenterId,items:[{resourceId:mv.resource,quantity:mv.quantity,unit:mv.unit}]})
      .then(()=>{setMovements(p=>[entry,...p]);notify("Movimento "+entry.id+" criado no Sienge");})
      .catch(e=>notify("Erro: "+e.message));
  }

  var NAV=[
    ["orders","Pedidos de Compra"],
    ["new","Nova Solicitação"],
    ["stock","Estoque"],
    ["flow","Fluxo"],
    ["endpoints","Endpoints"],
    ["connect","Conexão"]
  ];

  var content;
  if(tab==="orders")content=h(OrdersPage,{orders,live,loading,onReload:loadOrders,onAuthorize:doAuthorize,onDisapprove:doDisapprove,onAttach:attach,onEval:evaluate});
  else if(tab==="new")content=h(NewRequestPage,{onCreate:createRequest,requests,live});
  else if(tab==="stock")content=h(StockPage,{stock,movements,onMovement:createMovement,live});
  else if(tab==="flow")content=h(FlowPage,null);
  else if(tab==="endpoints")content=h(EndpointsPage,null);
  else content=h(ConnectPage,{cfg,setCfg,connected,setConnected,logLines,live,notify});

  return h("div",{style:{minHeight:"100vh",background:C.bg,color:C.ink,fontFamily:F}},
    /* Topbar */
    h("div",{style:{background:C.steel,color:"#fff",padding:"0 20px",height:54,display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50,boxShadow:"0 2px 8px rgba(0,0,0,.18)"}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:32,height:32,borderRadius:8,background:C.orange,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:18,color:"#fff"}},"S"),
        h("div",{style:{fontWeight:800,fontSize:17}},"Sienge ",h("span",{style:{fontWeight:400,opacity:.7}},"· Suprimentos"))),
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("a",{href:"app.html",style:{fontSize:12.5,color:"rgba(255,255,255,.7)",background:"rgba(255,255,255,.08)",padding:"4px 10px",borderRadius:6}},"← ERP completo"),
        h("span",{style:{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 11px",borderRadius:20,background:live?"rgba(31,157,85,.2)":"rgba(201,138,0,.2)",color:live?"#7ee0a8":"#f0c86a",fontWeight:600,fontSize:12.5}},
          h("span",{style:{width:7,height:7,borderRadius:7,background:live?C.green:C.amber}}),live?"Conectado ao Sienge":"Modo demo"))),
    /* Nav */
    h("div",{style:{background:C.panel,borderBottom:"1px solid "+C.line,padding:"0 20px",display:"flex",gap:2,overflowX:"auto",flexShrink:0}},
      NAV.map(([k,label])=>h("button",{key:k,onClick:()=>setTab(k),style:{background:"transparent",padding:"14px 16px",fontSize:13.5,whiteSpace:"nowrap",color:tab===k?C.orange:C.muted,borderBottom:"3px solid "+(tab===k?C.orange:"transparent"),fontFamily:F,fontWeight:tab===k?700:500,cursor:"pointer",border:"none",borderBottom:"3px solid "+(tab===k?C.orange:"transparent")}},label))),
    /* Content */
    h("div",{style:{maxWidth:1140,margin:"0 auto",padding:"24px 20px 80px"}},content),
    /* Toast */
