# Blueprint do Render — deploy automatico do Sienge Suprimentos.
# No Render: New + -> Blueprint -> selecione este repositorio.
# O Render le este arquivo e configura tudo sozinho.
# Voce so digita os valores marcados como "sync: false" (secretos) no painel.
#
# BANCO DE DADOS: PostgreSQL do Render em plano pago (basic-256mb),
# sem prazo de expiracao. Guarda os usuarios cadastrados.
databases:
  - name: sienge-db
    plan: basic-256mb

services:
  - type: web
    name: sienge-suprimentos
    runtime: node
    plan: free
    rootDir: siengesuprimentos_2/sienge-suprimentos
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Subdominio da empresa (aparece na URL SUAEMPRESA.sienge.com.br)
      - key: SIENGE_SUBDOMAIN
        value: macedofortes
      # Secretos — digite no painel do Render (nao ficam no repositorio):
      - key: SIENGE_USER
        sync: false
      - key: SIENGE_PASSWORD
        sync: false
      - key: APP_TOKEN
        sync: false
      # Conexao com o banco — injetada automaticamente pelo Render:
      - key: DATABASE_URL
        fromDatabase:
          name: sienge-db
          property: connectionString
      # Super-admin (criado/garantido na inicializacao). Senha e secreta.
      - key: ADMIN_NAME
        value: Luiz
      - key: ADMIN_EMAIL
        value: luiz
      - key: ADMIN_PASSWORD
        sync: false
