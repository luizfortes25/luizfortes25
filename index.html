<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homem Voador</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }
    #gameCanvas {
      border: 2px solid #4af;
      border-radius: 8px;
      box-shadow: 0 0 30px #4af8, 0 0 60px #4af3;
      cursor: pointer;
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 14px 24px;
      pointer-events: none;
    }
    .stat {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 8px #4af;
    }
    #message {
      position: absolute;
      color: #fff;
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      text-shadow: 0 0 12px #4af;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="ui">
    <span class="stat" id="scoreDisplay">Pontos: 0</span>
    <span class="stat" id="levelDisplay">Nível: 1</span>
    <span class="stat" id="highDisplay">Recorde: 0</span>
  </div>
  <div id="message"></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreDisplay');
    const levelEl = document.getElementById('levelDisplay');
    const highEl = document.getElementById('highDisplay');
    const msgEl = document.getElementById('message');

    const W = Math.min(window.innerWidth - 4, 800);
    const H = Math.min(window.innerHeight - 4, 520);
    canvas.width = W;
    canvas.height = H;

    const STATE = { MENU: 0, PLAYING: 1, DEAD: 2 };
    let state = STATE.MENU;
    let score = 0, highScore = 0, level = 1, frame = 0;
    let particles = [], stars = [], clouds = [];

    const player = {
      x: W * 0.18, y: H / 2, vy: 0, vx: 0,
      width: 36, height: 44, gravity: 0.38, flapPower: -7.5,
      maxVy: 9, alive: true, wingAngle: 0, wingDir: 1,
      cape: [], trail: [], flapping: false, flapTimer: 0, stars: 0, powerup: 0,
    };

    let obstacles = [], obstacleTimer = 0, obstacleInterval = 120, obstacleSpeed = 3.2;
    const GAP = 190;
    let coins = [], powerups = [];

    for (let i = 0; i < 80; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, speed: Math.random()*0.4+0.1, twinkle: Math.random()*Math.PI*2 });
    }
    for (let i = 0; i < 5; i++) {
      clouds.push({ x: Math.random()*W, y: Math.random()*(H*0.55), w: Math.random()*80+60, speed: Math.random()*0.4+0.2, alpha: Math.random()*0.15+0.05 });
    }

    function rand(a,b){ return Math.random()*(b-a)+a; }
    function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

    function spawnParticle(x,y,color,count=6,speed=3){
      for(let i=0;i<count;i++){
        const angle=Math.random()*Math.PI*2, s=Math.random()*speed+1;
        particles.push({x,y,vx:Math.cos(angle)*s,vy:Math.sin(angle)*s,life:1,decay:Math.random()*0.03+0.02,r:Math.random()*4+2,color});
      }
    }

    function spawnCoin(x,gapTop){ coins.push({x,y:gapTop+GAP/2,r:10,angle:0,collected:false}); }

    function spawnPowerup(x,gapTop){
      if(Math.random()<0.18) powerups.push({x,y:gapTop+GAP/2+rand(-30,30),r:13,angle:0,collected:false});
    }

    function spawnObstacle(){
      const gapTop=rand(60,H-GAP-60);
      obstacles.push({x:W+20,gapTop,width:52,passed:false,hue:Math.floor(rand(180,280))});
      spawnCoin(W+46,gapTop); spawnPowerup(W+46,gapTop);
    }

    function reset(){
      player.y=H/2; player.vy=0; player.vx=0; player.alive=true;
      player.trail=[]; player.powerup=0;
      obstacles=[]; coins=[]; powerups=[]; particles=[];
      obstacleTimer=0; obstacleSpeed=3.2; obstacleInterval=120;
      score=0; level=1; frame=0;
    }

    function flap(){
      if(!player.alive) return;
      player.vy=player.flapPower; player.flapping=true; player.flapTimer=12;
      spawnParticle(player.x-10,player.y+10,'#4af',4,2);
    }

    window.addEventListener('keydown',e=>{
      if(e.code==='Space'||e.code==='ArrowUp'){
        e.preventDefault();
        if(state===STATE.MENU||state===STATE.DEAD){ reset(); state=STATE.PLAYING; msgEl.style.display='none'; }
        else flap();
      }
    });
    canvas.addEventListener('pointerdown',()=>{
      if(state===STATE.MENU||state===STATE.DEAD){ reset(); state=STATE.PLAYING; msgEl.style.display='none'; }
      else flap();
    });

    function drawPillar(x,gapTop,width,hue){
      const capH=22;
      const gradT=ctx.createLinearGradient(x,0,x+width,0);
      gradT.addColorStop(0,`hsl(${hue},70%,25%)`); gradT.addColorStop(0.5,`hsl(${hue},70%,40%)`); gradT.addColorStop(1,`hsl(${hue},70%,20%)`);
      ctx.fillStyle=gradT; ctx.fillRect(x,0,width,gapTop);
      ctx.fillStyle=`hsl(${hue},70%,50%)`; ctx.beginPath(); ctx.roundRect(x-6,gapTop-capH,width+12,capH,6); ctx.fill();
      const gradB=ctx.createLinearGradient(x,0,x+width,0);
      gradB.addColorStop(0,`hsl(${hue},70%,25%)`); gradB.addColorStop(0.5,`hsl(${hue},70%,40%)`); gradB.addColorStop(1,`hsl(${hue},70%,20%)`);
      ctx.fillStyle=gradB; const botY=gapTop+GAP; ctx.fillRect(x,botY,width,H-botY);
      ctx.fillStyle=`hsl(${hue},70%,50%)`; ctx.beginPath(); ctx.roundRect(x-6,botY,width+12,capH,6); ctx.fill();
      ctx.strokeStyle=`hsla(${hue},90%,70%,0.5)`; ctx.lineWidth=2;
      ctx.strokeRect(x,0,width,gapTop); ctx.strokeRect(x,botY,width,H-botY);
    }

    function drawMan(x,y,flapping,powerup){
      ctx.save(); ctx.translate(x,y);
      if(powerup>0){
        const pulse=0.7+0.3*Math.sin(frame*0.15);
        ctx.beginPath(); ctx.arc(0,0,34*pulse,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,200,255,${0.6*pulse})`; ctx.lineWidth=4; ctx.stroke();
      }
      const capeWave=Math.sin(frame*0.12)*6;
      ctx.fillStyle='#c00'; ctx.beginPath();
      ctx.moveTo(-4,-8); ctx.quadraticCurveTo(-20+capeWave,0,-18+capeWave*0.5,18);
      ctx.quadraticCurveTo(-8,10,-4,8); ctx.closePath(); ctx.fill();
      const bodyGrad=ctx.createLinearGradient(-12,-14,12,14);
      bodyGrad.addColorStop(0,'#2255dd'); bodyGrad.addColorStop(1,'#112288');
      ctx.fillStyle=bodyGrad; ctx.beginPath(); ctx.roundRect(-12,-14,24,28,6); ctx.fill();
      ctx.fillStyle='#ffe94a'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('H',0,0);
      ctx.strokeStyle='#113399'; ctx.lineWidth=5; ctx.lineCap='round';
      const kick=Math.sin(frame*0.15)*12;
      ctx.beginPath(); ctx.moveTo(-5,14); ctx.lineTo(-6-kick*0.3,26+kick*0.2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5,14); ctx.lineTo(6+kick*0.3,26-kick*0.2); ctx.stroke();
      ctx.fillStyle='#cc3300';
      ctx.beginPath(); ctx.ellipse(-6-kick*0.3,28+kick*0.2,6,4,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(6+kick*0.3,28-kick*0.2,6,4,0,0,Math.PI*2); ctx.fill();
      const wA=flapping?Math.sin(frame*0.6)*0.5:Math.sin(frame*0.08)*0.25;
      ctx.fillStyle='rgba(150,220,255,0.85)';
      ctx.save(); ctx.rotate(-wA-0.2); ctx.beginPath();
      ctx.moveTo(-10,-6); ctx.bezierCurveTo(-32,-20,-38,4,-20,8); ctx.bezierCurveTo(-14,10,-10,2,-10,-6); ctx.fill(); ctx.restore();
      ctx.save(); ctx.rotate(wA+0.2); ctx.beginPath();
      ctx.moveTo(10,-6); ctx.bezierCurveTo(32,-20,38,4,20,8); ctx.bezierCurveTo(14,10,10,2,10,-6); ctx.fill(); ctx.restore();
      ctx.strokeStyle='#2255dd'; ctx.lineWidth=4;
      const armSwing=Math.sin(frame*0.15)*8;
      ctx.beginPath(); ctx.moveTo(-10,-4); ctx.lineTo(-22,4+armSwing); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10,-4); ctx.lineTo(22,4-armSwing); ctx.stroke();
      const headGrad=ctx.createRadialGradient(-3,-24,2,0,-22,13);
      headGrad.addColorStop(0,'#ffe0b0'); headGrad.addColorStop(1,'#cc8855');
      ctx.fillStyle=headGrad; ctx.beginPath(); ctx.arc(0,-22,13,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath();
      ctx.ellipse(-4,-23,3.5,3,0,0,Math.PI*2); ctx.ellipse(4,-23,3.5,3,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1a1a44'; ctx.beginPath(); ctx.arc(-4,-23,1.8,0,Math.PI*2); ctx.arc(4,-23,1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#113399'; ctx.beginPath(); ctx.ellipse(0,-21,8,4,0,0,Math.PI); ctx.fill();
      ctx.fillStyle='#1a0a00'; ctx.beginPath(); ctx.ellipse(0,-34,9,5,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#aa5500'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,-19,5,0.2,Math.PI-0.2); ctx.stroke();
      ctx.restore();
    }

    function drawCoin(coin){
      ctx.save(); ctx.translate(coin.x,coin.y); ctx.rotate(coin.angle);
      ctx.scale(Math.abs(Math.cos(coin.angle)),1);
      ctx.beginPath(); ctx.arc(0,0,coin.r,0,Math.PI*2);
      const g=ctx.createRadialGradient(-3,-3,1,0,0,coin.r);
      g.addColorStop(0,'#fff7a0'); g.addColorStop(0.5,'#ffd700'); g.addColorStop(1,'#b8860b');
      ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#daa520'; ctx.lineWidth=1.5; ctx.stroke(); ctx.restore();
    }

    function drawPowerup(pu){
      ctx.save(); ctx.translate(pu.x,pu.y); ctx.rotate(pu.angle);
      const pulse=0.85+0.15*Math.sin(frame*0.1); ctx.scale(pulse,pulse);
      ctx.beginPath(); ctx.arc(0,0,pu.r,0,Math.PI*2);
      const g=ctx.createRadialGradient(-4,-4,1,0,0,pu.r);
      g.addColorStop(0,'#a0ffff'); g.addColorStop(0.5,'#00ccff'); g.addColorStop(1,'#0066bb');
      ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle='#00eeff'; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle='#fff'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',0,0); ctx.restore();
    }

    function drawBackground(){
      const sky=ctx.createLinearGradient(0,0,0,H);
      sky.addColorStop(0,'#050518'); sky.addColorStop(0.5,'#0a1030'); sky.addColorStop(1,'#101845');
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
      for(const s of stars){
        s.twinkle+=0.04; const alpha=0.5+0.5*Math.sin(s.twinkle);
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(255,255,255,${alpha})`; ctx.fill();
        s.x-=s.speed; if(s.x<0){s.x=W;s.y=Math.random()*H;}
      }
      for(const c of clouds){
        ctx.globalAlpha=c.alpha; ctx.fillStyle='#8899cc';
        ctx.beginPath(); ctx.ellipse(c.x,c.y,c.w,c.w*0.35,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(c.x-c.w*0.3,c.y+6,c.w*0.5,c.w*0.25,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(c.x+c.w*0.3,c.y+6,c.w*0.4,c.w*0.22,0,0,Math.PI*2); ctx.fill();
        ctx.globalAlpha=1; c.x-=c.speed; if(c.x+c.w<0){c.x=W+c.w;c.y=Math.random()*H*0.55;}
      }
    }

    function drawTrail(){
      for(let i=0;i<player.trail.length;i++){
        const t=player.trail[i], alpha=(i/player.trail.length)*0.35;
        ctx.beginPath(); ctx.arc(t.x,t.y,5*(i/player.trail.length),0,Math.PI*2);
        ctx.fillStyle=player.powerup>0?`rgba(0,220,255,${alpha})`:`rgba(80,160,255,${alpha})`; ctx.fill();
      }
    }

    function drawParticles(){
      for(let i=particles.length-1;i>=0;i--){
        const p=particles[i]; ctx.globalAlpha=p.life;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
        ctx.fillStyle=p.color; ctx.fill();
        p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=p.decay;
        if(p.life<=0) particles.splice(i,1);
      }
      ctx.globalAlpha=1;
    }

    function drawHUD(){
      scoreEl.textContent=`Pontos: ${score}`;
      levelEl.textContent=`Nível: ${level}`;
      highEl.textContent=`Recorde: ${highScore}`;
      if(player.powerup>0){
        const bw=120,bh=8,bx=W/2-60,by=12;
        ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(bx-1,by-1,bw+2,bh+2);
        const sg=ctx.createLinearGradient(bx,by,bx+bw,by);
        sg.addColorStop(0,'#00eeff'); sg.addColorStop(1,'#0088cc');
        ctx.fillStyle=sg; ctx.fillRect(bx,by,bw*(player.powerup/200),bh);
        ctx.fillStyle='#fff'; ctx.font='9px Arial'; ctx.textAlign='center'; ctx.fillText('ESCUDO',W/2,by+20);
      }
    }

    function showMessage(text,sub=''){
      msgEl.innerHTML=text+(sub?`<br><span style="font-size:16px;opacity:0.7">${sub}</span>`:'');
      msgEl.style.display='block';
      const rect=canvas.getBoundingClientRect();
      msgEl.style.top=(rect.top+H/2-50)+'px';
      msgEl.style.left=rect.left+'px';
      msgEl.style.width=W+'px';
    }

    function circleRect(cx,cy,cr,rx,ry,rw,rh){
      const nx=clamp(cx,rx,rx+rw), ny=clamp(cy,ry,ry+rh);
      return (cx-nx)**2+(cy-ny)**2<cr*cr;
    }

    function checkCollisions(){
      const px=player.x,py=player.y,pr=14;
      if(py-pr<=0||py+pr>=H) return true;
      for(const ob of obstacles){
        if(ob.x>px+pr+ob.width||ob.x+ob.width<px-pr) continue;
        if(player.powerup>0) continue;
        if(circleRect(px,py,pr,ob.x-6,0,ob.width+12,ob.gapTop)) return true;
        if(circleRect(px,py,pr,ob.x-6,ob.gapTop+GAP,ob.width+12,H-ob.gapTop-GAP)) return true;
      }
      return false;
    }

    function update(){
      frame++;
      const newLevel=1+Math.floor(score/8);
      if(newLevel>level){ level=newLevel; obstacleSpeed=3.2+level*0.4; obstacleInterval=Math.max(65,120-level*7); spawnParticle(player.x,player.y,'#ffe94a',16,4); }
      player.vy+=player.gravity; player.vy=clamp(player.vy,-12,player.maxVy); player.y+=player.vy;
      if(player.flapTimer>0) player.flapTimer--; else player.flapping=false;
      if(player.powerup>0) player.powerup--;
      player.trail.push({x:player.x,y:player.y});
      if(player.trail.length>18) player.trail.shift();
      if(frame%3===0) spawnParticle(player.x-8,player.y+5,player.powerup>0?'#00eeff':'#4af',2,1.5);
      obstacleTimer++;
      if(obstacleTimer>=obstacleInterval){ obstacleTimer=0; spawnObstacle(); }
      for(let i=obstacles.length-1;i>=0;i--){
        const ob=obstacles[i]; ob.x-=obstacleSpeed;
        if(!ob.passed&&ob.x+ob.width<player.x){ ob.passed=true; score++; spawnParticle(player.x,player.y,'#ffe94a',8,3); }
        if(ob.x+ob.width<-20) obstacles.splice(i,1);
      }
      for(let i=coins.length-1;i>=0;i--){
        const c=coins[i]; c.x-=obstacleSpeed; c.angle+=0.07;
        if(!c.collected){ const dx=player.x-c.x,dy=player.y-c.y; if(dx*dx+dy*dy<(player.powerup>0?30:20)**2){ c.collected=true; score+=1; spawnParticle(c.x,c.y,'#ffd700',10,3); } }
        if(c.x<-20) coins.splice(i,1);
      }
      for(let i=powerups.length-1;i>=0;i--){
        const pu=powerups[i]; pu.x-=obstacleSpeed; pu.angle+=0.04;
        if(!pu.collected){ const dx=player.x-pu.x,dy=player.y-pu.y; if(dx*dx+dy*dy<22**2){ pu.collected=true; player.powerup=200; spawnParticle(pu.x,pu.y,'#00eeff',16,4); } }
        if(pu.x<-20) powerups.splice(i,1);
      }
      if(checkCollisions()){
        player.alive=false; spawnParticle(player.x,player.y,'#ff4444',20,5);
        if(score>highScore) highScore=score;
        state=STATE.DEAD;
        setTimeout(()=>{ showMessage('Você caiu!',`Pontos: ${score} | Recorde: ${highScore}<br>Espaço / Toque para recomeçar`); },500);
      }
    }

    function draw(){
      drawBackground(); drawTrail();
      for(const ob of obstacles) drawPillar(ob.x,ob.gapTop,ob.width,ob.hue);
      for(const c of coins) if(!c.collected) drawCoin(c);
      for(const pu of powerups) if(!pu.collected) drawPowerup(pu);
      drawMan(player.x,player.y,player.flapping,player.powerup);
      drawParticles(); drawHUD();
    }

    function drawMenu(){
      drawBackground(); drawParticles();
      ctx.save(); ctx.textAlign='center';
      ctx.shadowColor='#4af'; ctx.shadowBlur=24;
      ctx.fillStyle='#fff'; ctx.font='bold 46px Arial'; ctx.fillText('HOMEM VOADOR',W/2,H/2-80);
      ctx.shadowBlur=0; ctx.font='20px Arial'; ctx.fillStyle='#aaddff';
      ctx.fillText('Pressione ESPAÇO ou toque para voar!',W/2,H/2-30);
      drawMan(W/2,H/2+50+Math.sin(frame*0.06)*18,true,0);
      ctx.font='15px Arial'; ctx.fillStyle='#8899bb';
      ctx.fillText('Espaço / Toque — voar',W/2,H-50);
      ctx.fillText('Colete moedas  ★ = escudo  Desvie dos pilares',W/2,H-30);
      ctx.restore();
    }

    function loop(){
      ctx.clearRect(0,0,W,H);
      if(state===STATE.PLAYING){ update(); draw(); }
      else if(state===STATE.MENU){ frame++; if(frame%20===0) spawnParticle(rand(0,W),rand(0,H),'#4af',3,1); drawMenu(); }
      else if(state===STATE.DEAD){ frame++; drawBackground(); drawParticles(); for(const ob of obstacles) drawPillar(ob.x,ob.gapTop,ob.width,ob.hue); for(const c of coins) if(!c.collected) drawCoin(c); drawMan(player.x,player.y,false,0); drawHUD(); }
      requestAnimationFrame(loop);
    }

    showMessage('HOMEM VOADOR','Pressione Espaço ou toque para começar');
    loop();
  </script>
</body>
</html>
